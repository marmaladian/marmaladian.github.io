  <script>
    (function () {
      var THEMES = ['light', 'dark'];
      var saved = localStorage.getItem('theme');
      if (THEMES.indexOf(saved) !== -1) {
        document.documentElement.setAttribute('data-theme', saved);
      }
      document.addEventListener('DOMContentLoaded', function () {
        var button = document.getElementById('theme-toggle');
        button.addEventListener('click', function () {
          var root = document.documentElement;
          // With no attribute set the page is following the operating
          // system, so resolve that first — otherwise the first click
          // would move to the theme already on screen.
          var current = root.getAttribute('data-theme');
          if (THEMES.indexOf(current) === -1) {
            current = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark' : 'light';
          }
          var next = THEMES[(THEMES.indexOf(current) + 1) % THEMES.length];
          root.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
        });
      });

      // The running head: a small copy of the page title that lives in the
      // sticky bar and only shows once the real h1 has scrolled out from
      // under it. An IntersectionObserver watches the h1 against a root
      // shrunk by the bar's own height, so "intersecting" means "still
      // below the bar" — the moment it isn't, the two swap places. The
      // fade itself is a CSS transition on .is-faded/.is-visible; this
      // only flips the classes.
      document.addEventListener('DOMContentLoaded', function () {
        var h1 = document.getElementById('page-title');
        var bar = document.querySelector('.runhead');
        var label = document.getElementById('runhead-title');
        if (!h1 || !bar || !label || !('IntersectionObserver' in window)) return;
        var barHeight = bar.getBoundingClientRect().height;
        new IntersectionObserver(function (entries) {
          var past = !entries[0].isIntersecting;
          h1.classList.toggle('is-faded', past);
          label.classList.toggle('is-visible', past);
        }, { rootMargin: -barHeight + 'px 0px 0px 0px', threshold: 0 }).observe(h1);
      });

      // The folio: a book's running page number, repurposed here as how
      // far through the page the reader is. 0% at the very top, 100% once
      // the bottom of the document has scrolled into view — a plain
      // fraction of scrollable distance covered, not tied to headings, so
      // it works the same on every page regardless of how it's sectioned.
      document.addEventListener('DOMContentLoaded', function () {
        var folio = document.getElementById('runhead-folio');
        if (!folio) return;
        var ticking = false;
        function update() {
          ticking = false;
          var scrollable = document.documentElement.scrollHeight - window.innerHeight;
          var percent = scrollable <= 0 ? 100 : (window.scrollY / scrollable) * 100;
          percent = Math.max(0, Math.min(100, Math.round(percent)));
          folio.textContent = percent + '%';
        }
        function onScroll() {
          if (!ticking) {
            ticking = true;
            requestAnimationFrame(update);
          }
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll);
        update();
      });
    })();
  </script>
