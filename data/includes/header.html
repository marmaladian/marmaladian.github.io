<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/prototype.css">
  <title>{{title}}</title>
  <script>
    (function () {
      // Theme: the page starts in the light theme (white on blue). The sun
      // button swaps to the dark theme (blue on white) and back. The choice
      // is saved for the next page.
      var saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }

      document.addEventListener('DOMContentLoaded', function () {
        var root = document.documentElement;
        document.getElementById('theme-toggle').addEventListener('click', function () {
          var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
        });

        // Running title: when the h1 scrolls under the bar, the h1 fades
        // out and the copy of the title in the bar fades in.
        var h1 = document.getElementById('page-title');
        var bar = document.querySelector('.runhead');
        var label = document.getElementById('runhead-title');
        if (!h1 || !bar || !label || !('IntersectionObserver' in window)) return;
        var barHeight = bar.getBoundingClientRect().height;
        new IntersectionObserver(function (entries) {
          var past = !entries[0].isIntersecting;
          h1.classList.toggle('is-faded', past);
          label.classList.toggle('is-visible', past);
        }, { rootMargin: -barHeight + 'px 0px 0px 0px', threshold: 0 }).observe(h1);
      });
    })();
  </script>
</head>
<body id="top">

  <div class="runhead">
    <a class="runhead-home" href="index.html" aria-label="gray.land — home">{{logo}}</a>
    <span class="runhead-title" id="runhead-title" aria-hidden="true">{{title}}</span>
    <button id="theme-toggle" class="runhead-toggle" aria-label="Swap text and background colours">&#9728;&#xFE0E;</button>
  </div>

  <main>
{{pagehead}}
